[package]
name = "rupert-verify"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Snap-and-certify verifier. F64Epsilon + IntervalSnap; exact rational path gated behind `exact`."

[lints]
workspace = true

# malachite is the only feature-gated v2 path now; inari is non-optional
# (used by `interval_cert` for IntervalSnap).
[package.metadata.cargo-machete]
ignored = ["malachite"]

[features]
default = []
# Enables exact rational verification via malachite. v0.2 work item.
exact = ["dep:malachite"]

[dependencies]
rupert-core = { workspace = true }
rupert-shapes = { workspace = true }
thiserror = { workspace = true }
inari = { workspace = true }
malachite = { workspace = true, optional = true }

[dev-dependencies]
rupert-solvers = { workspace = true }
